spring.application.name=braincode-api
server.port=8080
# 仅本机访问：避免同局域网其他设备直接读写个人数据
server.address=127.0.0.1

# 数据根目录：默认位于项目所在磁盘（D 盘）的 data 目录，可用 BRAINCODE_DATA_DIR 覆盖
braincode.data-dir=${BRAINCODE_DATA_DIR:./data}
spring.datasource.url=jdbc:sqlite:${braincode.data-dir}/braincode.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
# SQLite 单写者模型，过大的连接池只会浪费资源
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jackson.time-zone=Asia/Shanghai
braincode.notes-dir=${braincode.data-dir}/notes
braincode.lucene-dir=${braincode.data-dir}/lucene

braincode.ai.provider=${BRAINCODE_AI_PROVIDER:deepseek}
braincode.ai.ollama-url=${OLLAMA_BASE_URL:http://localhost:11434}
braincode.ai.ollama-model=${OLLAMA_MODEL:qwen2.5:7b}
braincode.ai.deepseek-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
braincode.ai.deepseek-model=${DEEPSEEK_MODEL:deepseek-chat}
braincode.ai.deepseek-key=${DEEPSEEK_API_KEY:}

# 上下文预算：控制每次送入模型的知识量，避免无谓的 token 消耗
braincode.ai.chat-context-notes=8
braincode.ai.chat-context-chars=4000
braincode.ai.context-note-chars=900
braincode.ai.suggestion-candidates=12
braincode.ai.suggestion-note-chars=700
braincode.ai.web-search-enabled=${BRAINCODE_WEB_SEARCH:true}
