<body><div class="app">
<header class="topbar"><button id="newBtn" class="new-btn">＋ 新建</button><button id="sideToggle" class="icon-btn side-toggle hidden" title="显示日历">☰</button><div class="segmented" id="views"><button data-view="day">日</button><button data-view="week" class="active">周</button><button data-view="month">月</button><button data-view="year">年</button></div><div class="navarrows"><button class="icon-btn" id="prev">‹</button><button class="toolbar-btn" id="today">今天</button><button class="icon-btn" id="next">›</button></div><div class="period" id="period"></div><div class="spacer"></div><input id="search" class="search" placeholder="搜索日历" type="search"><button class="toolbar-btn" id="exportCalendar" title="把日历中的事件导出为 .ics">导出日历</button><button class="toolbar-btn" id="settings">设置</button></header>
<div class="layout"><aside class="sidebar" id="sidebar"><div><div class="group-title" data-collapse="mine">⌄ 我的日历</div><div id="cats"></div></div><div><div class="group-title" data-collapse="other">⌄ 其他</div><div class="other-item" id="uncatToggle">◉ 未分类</div><div id="searchResults" class="search-results hidden"></div></div><div class="mini"><div class="mini-head"><button id="miniPrev">‹</button><span id="miniLabel"></span><button id="miniNext">›</button></div><div class="mini-grid" id="mini"></div></div><div class="side-bottom"><button id="goToday">今天</button><button data-view="day">日</button><button data-view="week">周</button><button data-view="month">月</button></div></aside>
<main class="main"><div class="calendar-scroll" id="calendar"></div><div class="stats" id="stats"></div></main></div></div>
<div class="drawer" id="drawer"><button class="icon-btn" id="closeDrawer" style="float:right">×</button><h2 id="drawerTitle">新建事件</h2><form id="eventForm"><input type="hidden" id="eventId"><label class="field">标题<input id="title" required maxlength="150" autocomplete="off"></label><div class="field">分类（必选）<div class="colors" id="categoryChoices"></div></div><label class="field"><input type="checkbox" id="allDay"> 全天</label><label class="field">开始<input type="datetime-local" id="start" required></label><label class="field">结束<input type="datetime-local" id="end" required></label><div id="formError" class="danger"></div><label class="field">地点<input id="location"></label><label class="field">备注<textarea id="notes"></textarea></label><label class="field">提醒<select id="reminder"><option value="">不提醒</option><option>准时</option><option>前5分钟</option><option>前15分钟</option><option>前1小时</option><option>前1天</option></select></label><label class="field">重复<select id="repeat"><option value="none">不重复</option><option value="daily">每天</option><option value="weekly">每周</option><option value="monthly">每月</option><option value="yearly">每年</option></select></label><label class="field" id="repeatEndWrap" hidden>重复结束日期<input id="repeatEnd" type="date"></label><div class="drawer-actions"><button type="button" id="deleteEvent" class="danger hidden">删除</button><button type="button" id="cancelEdit">取消</button><button class="done" type="submit">完成</button></div></form></div>
<div id="modalHost"></div><div id="floatHost"></div><div id="toast" class="toast hidden"></div>
<script>
/* store */
(()=>{'use strict';const KEY='color-calendar-v1',palette=[['红','#d64b4b'],['橙','#e07832'],['黄','#bc8a12'],['绿','#39834e'],['蓝','#3478c8'],['浅蓝','#1598aa'],['紫','#8656b5'],['粉','#cb5a86'],['灰','#777b82'],['青','#218b82'],['珊瑚','#e85f5c'],['琥珀','#d99524'],['柠檬','#9a9b28'],['薄荷','#55a98b'],['森林','#28705c'],['天蓝','#4da9d2'],['海军蓝','#345b8c'],['薰衣草','#a58bc4'],['玫瑰','#b64d70'],['桃色','#df8e78'],['葡萄','#68478c'],['石板','#5f7585'],['湖蓝','#267f9c'],['草绿','#78a84b']];const defaults=[['工作','#3478c8','💼'],['学习','#8656b5','📚'],['生活','#39834e','🌿'],['运动','#e07832','🏃'],['社交','#cb5a86','☕'],['纪念日','#d64b4b','🎂']];const today=new Date();today.setHours(0,0,0,0);const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const plus=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};const weekStart=(d,mon=true)=>{let x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+(mon?6:0))%7));return x};const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const parse=(s)=>new Date(s);const localDT=d=>`${iso(d)}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!state.categories){let mon=weekStart(today);state={categories:defaults.map((c,i)=>({id:'c'+i,name:c[0],color:c[1],emoji:c[2],visible:true,track:true,group:'我的日历'})),events:[],view:'week',cursor:iso(today),weekStartMonday:true,workStart:8,workEnd:22,slot:60,dark:false,uncatVisible:true};const at=(day,h,m=0)=>{let d=plus(mon,day);d.setHours(h,m,0,0);return d};const add=(title,cat,start,end,extra={})=>state.events.push({id:uid(),title,category:cat,start:localDT(start),end:localDT(end),allDay:!!extra.allDay,location:extra.location||'',notes:extra.notes||'',reminder:'',repeat:extra.repeat||'none',repeatEnd:extra.repeatEnd||''});add('周例会','c0',at(0,10),at(0,11),{location:'会议室 A'});add('项目深度工作','c0',at(1,9),at(1,11));add('阅读：设计与日常','c1',at(1,14),at(1,15,30));add('力量训练','c3',at(2,18),at(2,19));add('朋友生日','c5',at(3,0),at(3,23,59),{allDay:true});add('短途旅行','c2',at(4,0),at(6,23,59),{allDay:true,location:'杭州'});add('复盘计划','c1',at(1,9,30),at(1,10,30));add('晨间散步','c2',at(2,7),at(2,7,45),{repeat:'weekly',repeatEnd:iso(plus(today,90))});localStorage.setItem(KEY,JSON.stringify(state))}const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
/* render/store helpers */
const $=s=>document.querySelector(s),el=(tag,cls='',html='')=>{let n=document.createElement(tag);if(cls)n.className=cls;if(html)n.innerHTML=html;return n},cat=id=>state.categories.find(c=>c.id===id),color=id=>cat(id)?.color||'#777b82',visible=e=>{let c=cat(e.category);return c?c.visible:state.uncatVisible},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const toast=m=>{let n=$('#toast');n.textContent=m;n.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>n.classList.add('hidden'),2400)};const fmtTime=s=>{let d=parse(s);return d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})};const duration=e=>Math.max(0,(parse(e.end)-parse(e.start))/36e5);function occurrences(from,to){let out=[];for(let e of state.events){let s=parse(e.start),end=parse(e.end);if(e.repeat==='none'){if(end>=from&&s<=to)out.push({...e,occurrenceId:e.id});continue}let max=e.repeatEnd?new Date(e.repeatEnd+'T23:59'):to;for(let d=new Date(s),guard=0;d<=to&&d<=max&&guard<400;guard++){let hit=d>=from; if(hit){let diff=(d-s)/864e5;let ok=e.repeat==='daily'||(e.repeat==='weekly'&&Math.floor(diff/7)>=0&&(d.getDay()===s.getDay()))||(e.repeat==='monthly'&&d.getDate()===s.getDate())||(e.repeat==='yearly'&&d.getMonth()===s.getMonth()&&d.getDate()===s.getDate());if(ok){let shift=d-s,ss=new Date(s.getTime()+shift),ee=new Date(end.getTime()+shift);out.push({...e,start:localDT(ss),end:localDT(ee),occurrenceId:e.id+'@'+iso(d),sourceId:e.id})}}if(e.repeat==='daily')d.setDate(d.getDate()+1);else if(e.repeat==='weekly')d.setDate(d.getDate()+1);else if(e.repeat==='monthly')d.setDate(d.getDate()+1);else d.setDate(d.getDate()+1)}}return out.filter(visible)}let selectedEvent=null,searchText='';
function render(){document.body.classList.toggle('dark',state.dark);$('#views').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));let cur=parse(state.cursor+'T12:00');let title=state.view==='year'?cur.getFullYear()+'年':state.view==='month'?cur.getFullYear()+'年'+(cur.getMonth()+1)+'月':state.view==='day'?cur.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'}):(()=>{let a=weekStart(cur,state.weekStartMonday),b=plus(a,6);return a.getMonth()===b.getMonth()?a.getFullYear()+'年'+(a.getMonth()+1)+'月':a.getFullYear()+'年'+(a.getMonth()+1)+'月 – '+(b.getMonth()+1)+'月'})();$('#period').textContent=title;renderCats();renderMini();renderCalendar();renderStats();renderSearch();$('#uncatToggle').style.opacity=state.uncatVisible?'1':'.45'}
function renderCats(){let host=$('#cats');host.innerHTML='';state.categories.forEach((c,i)=>{let row=el('div','cat-row');row.draggable=true;row.dataset.id=c.id;let check=el('span','cat-check');check.style.borderColor=c.color;if(c.visible){check.style.background=c.color;check.textContent='✓'}let dot=el('i','cat-dot');dot.style.background=c.color;row.append(check,dot,el('span','cat-name',esc(c.name)),el('span','cat-emoji',esc(c.emoji||'')));let edit=el('button','cat-edit','✎');edit.title='编辑分类';edit.onclick=e=>{e.stopPropagation();editCategory(c.id)};row.append(edit);row.onclick=e=>{if(e.ctrlKey){let onlyThis=c.visible&&state.categories.filter(x=>x.visible).length===1;if(onlyThis)state.categories.forEach(x=>x.visible=true);else state.categories.forEach(x=>x.visible=x.id===c.id)}else c.visible=!c.visible;save();render()};row.ondragstart=e=>{e.dataTransfer.setData('text/plain',c.id)};row.ondragover=e=>e.preventDefault();row.ondrop=e=>{e.preventDefault();let id=e.dataTransfer.getData('text/plain'),from=state.categories.findIndex(x=>x.id===id),to=state.categories.findIndex(x=>x.id===c.id);if(from>=0){let [x]=state.categories.splice(from,1);state.categories.splice(to,0,x);save();render()}};host.append(row)})}
function renderMini(){let d=parse(state.cursor+'T12:00');$('#miniLabel').textContent=d.toLocaleDateString('zh-CN',{year:'numeric',month:'long'});let first=new Date(d.getFullYear(),d.getMonth(),1),start=weekStart(first,state.weekStartMonday),host=$('#mini');host.innerHTML='';'一二三四五六日'.split('').forEach(x=>host.append(el('span','',x)));let occ=occurrences(start,plus(start,41));for(let i=0;i<42;i++){let x=plus(start,i),key=iso(x),sp=el('span',`${x.getMonth()!==d.getMonth()?'muted':''} ${key===iso(today)?'today':''} ${key===state.cursor?'picked':''}`,String(x.getDate())),a=new Date(x);a.setHours(0,0,0,0);let b=plus(a,1),items=occ.filter(e=>parse(e.start)<b&&parse(e.end)>=a),cats=[...new Set(items.map(e=>e.category))].slice(0,4);if(cats.length){let dots=el('i','mini-dots');cats.forEach(id=>{let dot=el('i');dot.style.background=color(id);dots.append(dot)});sp.append(dots)}sp.onclick=()=>{state.cursor=key;if(state.view==='year')state.view='month';else if(state.view==='month'){}else state.view='day';save();render()};host.append(sp)}}function evHTML(e,all=false){let c=color(e.category);return `<div role="button" tabindex="0" class="event ${all?'all':''}" draggable="true" data-eid="${esc(e.occurrenceId||e.id)}" data-source="${esc(e.sourceId||e.id)}" style="--c:${c};--bg:${c}1f"><span class="ev-title">${esc(e.title)}</span><span class="ev-time">${e.allDay?'全天':fmtTime(e.start)+' – '+fmtTime(e.end)}</span><span class="ev-x" title="快速删除">×</span></div>`}
function bindEvents(host){host.querySelectorAll('.event').forEach(n=>{n.onclick=e=>{if(e.target.classList.contains('ev-x')){e.stopPropagation();deleteEvent(n.dataset.source);return}e.stopPropagation();let ev=state.events.find(x=>x.id===n.dataset.source);if(ev){selectedEvent=ev;detail(ev,e.clientX,e.clientY)}};n.ondblclick=e=>{e.stopPropagation();let ev=state.events.find(x=>x.id===n.dataset.source);if(ev){selectedEvent=ev;openEditor(ev)}};n.ondragstart=e=>{e.dataTransfer.setData('text/plain',n.dataset.source);e.dataTransfer.effectAllowed='move'}});host.querySelectorAll('[data-dropdate]').forEach(n=>{n.ondragover=e=>e.preventDefault();n.ondrop=e=>{e.preventDefault();let id=e.dataTransfer.getData('text/plain'),ev=state.events.find(x=>x.id===id);if(!ev)return;let old=parse(ev.start),target=new Date(n.dataset.dropdate+'T'+fmtTime(ev.start));if(n.classList.contains('daycol')){let r=n.getBoundingClientRect(),hour=state.view==='day'?96:56,minute=Math.max(0,Math.min((state.workEnd-state.workStart)*60,Math.round((e.clientY-r.top)/hour*4)*15)),min=state.workStart*60+minute;target.setHours(Math.floor(min/60),min%60,0,0)}let delta=target-old;ev.start=localDT(target);ev.end=localDT(new Date(parse(ev.end).getTime()+delta));save();render();toast('已移动日程')}})}
function daysForView(cur){if(state.view==='day')return [new Date(cur)];let s=weekStart(cur,state.weekStartMonday);return Array.from({length:7},(_,i)=>plus(s,i))}

function renderTimeView(host,cur){let days=daysForView(cur),from=new Date(days[0]);from.setHours(0,0,0,0);let to=new Date(days[days.length-1]);to.setHours(23,59,59,999);let events=occurrences(from,to),startHour=6,endHour=24,pxHour=state.view==='day'?96:56;let title=el('div','view-title',`<div><h1>${state.view==='day'?cur.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'}):''}</h1></div><div class="title-nav"><button data-nav="prev">‹</button><button data-nav="today">今天</button><button data-nav="next">›</button></div>`);host.append(title);let head=el('div','week-head');head.append(el('div'));days.forEach(d=>{let x=el('div','dayhead '+(iso(d)===iso(today)?'today':''),`${d.toLocaleDateString('zh-CN',{weekday:'short'})}<b>${d.getDate()}</b>`);head.append(x)});host.append(head);let all=el('div','allday '+(state.view==='day'?'day-all-day':''));all.append(el('div','allday-label','全天'));days.forEach(d=>{let col=el('div','allday-col');col.dataset.dropdate=iso(d);events.filter(e=>{let s=parse(e.start),en=parse(e.end);return e.allDay&&iso(s)<=iso(d)&&iso(en)>=iso(d)}).forEach(e=>col.insertAdjacentHTML('beforeend',evHTML(e,true)));all.append(col)});host.append(all);let wrap=el('div','time-wrap'),hours=el('div','hours');hours.style.setProperty('--hour',pxHour+'px');hours.style.gridTemplateRows=`repeat(${endHour-startHour},var(--hour))`;for(let h=startHour;h<endHour;h++)hours.append(el('span','',String(h).padStart(2,'0')+':00'));let cols=el('div','days');days.forEach(d=>{let col=el('div','daycol '+(state.workEnd<=21?'':' offhours'));col.style.setProperty('--hour',pxHour+'px');col.style.height=`${(endHour-startHour)*pxHour}px`;col.dataset.dropdate=iso(d);let dayEvents=events.filter(e=>!e.allDay&&parse(e.start)<plus(d,1)&&parse(e.end)>d);layoutTimed(dayEvents,d,col,startHour,endHour,pxHour);col.addEventListener('mousedown',e=>{if(e.target.closest('.event'))return;let r=col.getBoundingClientRect(),y=e.clientY-r.top,start=Math.max(0,Math.floor(y/pxHour*4)*15),band function renderMonth(host,cur){let first=new Date(cur.getFullYear(),cur.getMonth(),1),start=weekStart(first,state.weekStartMonday),end=plus(start,41),events=occurrences(start,plus(end,1));let title=el('div','view-title',`<h1>${cur.getFullYear()}年${cur.getMonth()+1}月</h1><div class="title-nav"><button data-nav="prev">‹</button><button data-nav="today">今天</button><button data-nav="next">›</button></div>`);host.append(title);let grid=el('div','month-grid');'一二三四五六日'.split('').forEach(x=>grid.append(el('div','month-dow','周'+x)));for(let i=0;i<42;i++){let d=plus(start,i),cell=el('div','month-cell '+(d.getMonth()!==cur.getMonth()?'out':''));cell.dataset.dropdate=iso(d);let date=el('div','month-date '+(iso(d)===iso(today)?'today':''),`<b>${d.getDate()}</b>`);date.onclick=()=>{state.view='week';state.cursor=iso(d);save();render()};cell.append(date);let list=events.filter(e=>{let s=parse(e.start),en=parse(e.end);return e.allDay?iso(s)<=iso(d)&&iso(en)>=iso(d):s<=new Date(iso(d)+'T23:59')&&en>=new Date(iso(d)+'T00:00')}).sort((a,b)=>a.start.localeCompare(b.start));let box=el('div','month-events');list.slice(0,4).forEach(e=>box.insertAdjacentHTML('beforeend',evHTML(e,true)));if(list.length>4){let more=el('div','more','+'+(list.length-4)+' 更多');more.onclick=()=>{state.cursor=iso(d);state.view='day';save();render()};box.append(more)}cell.append(box);cell.onclick=e=>{if(!e.target.closest('.event,.more,.month-date'))openEditor(null,{start:iso(d)+'T09:00',end:iso(d)+'T10:00'})};grid.append(cell)}host.append(grid);bindEvents(host);title.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav))}

document.querySelectorAll('[data-collapse]').forEach(n=>n.onclick=()=>{n.nextElementSibling.classList.toggle('hidden');n.textContent=n.nextElementSibling.classList.contains('hidden')?'› '+n.textContent.slice(2):'⌄ '+n.textContent.slice(2)});/* keyboard and actions */
$('#newBtn').onclick=()=>{let d=parse(state.cursor+'T12:00'),now=new Date();if(iso(d)===iso(today)){d=now;d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0)}else d.setHours(9,0,0,0);openEditor(null,{start:localDT(d),end:localDT(new Date(d.getTime()+3600000))})};$('#prev').onclick=()=>navigate('prev');$('#next').onclick=()=>navigate('next');$('#today').onclick=$('#goToday').onclick=()=>navigate('today');$('#settings').onclick=settings;$('#exportCalendar').onclick=exportIcs;$('#closeDrawer').onclick=$('#cancelEdit').onclick=closeDrawer;$('#deleteEvent').onclick=()=>deleteEvent($('#eventId').value);$('#repeat').onchange=()=>$('#repeatEndWrap').hidden=$('#repeat').value==='none';$('#start').onchange=$('#end').onchange=()=>validateForm();$('#allDay').onchange=()=>{if($('#allDay').checked){let s=parse($('#start').value),e=parse($('#end').value);s.setHours(0,0,0,0);e.setHours(23,59,0,0);$('#start').value=localDT(s);$('#end').value=localDT(e)}validateForm()};$('#eventForm').onsubmit=e=>{e.preventDefault();saveEvent()};$('#views').onclick=e=>{let b=e.target.closest('[data-view]');if(b){state.view=b.dataset.view;save();render()}};document.querySelectorAll('.side-bottom [data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;save();render()});$('#search').oninput=e=>{searchText=e.target.value;renderSearch()};$('#search').onkeydown=e=>{if(e.key==='Escape'){e.target.value='';searchText='';renderSearch()}};$('#sideToggle').onclick=()=>$('#sidebar').classList.toggle('open');document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();$('#modalHost').innerHTML='';$('#floatHost').innerHTML='';$('#sidebar').classList.remove('open')}if(e.ctrlKey&&e.key.toLowerCase()==='n'){e.preventDefault();$('#newBtn').click()}if(e.ctrlKey&&e.key.toLowerCase()==='f'){e.preventDefault();$('#search').focus()}if(e.ctrlKey&&e.key.toLowerCase()==='t'){e.preventDefault();navigate('today')}if(e.ctrlKey&&['1','2','3','4'].includes(e.key)){state.view={1:'day',2:'week',3:'month',4:'year'}[e.key];save();render()}if(e.ctrlKey&&e.key==='ArrowLeft')navigate('prev');if(e.ctrlKey&&e.key==='ArrowRight')navigate('next');if(e.ctrlKey&&e.key.toLowerCase()==='k')settings();if(e.key==='Delete'&&selectedEvent)deleteEvent(selectedEvent.id);if(e.key==='?'&&!e.ctrlKey)toast('Ctrl+N 新建 · Ctrl+←/→ 翻页 · Ctrl+T 今天 · Ctrl+1-4 视图 · Ctrl+F 搜索 · Ctrl+K 设置 · Esc 关闭')});document.addEventListener('contextmenu',e=>{let evEl=e.target.closest('.event');if(!evEl)return;e.preventDefault();let source=evEl.dataset.source,ev=state.events.find(x=>x.id===source);let menu=el('div','menu');menu.style.left=e.clientX+'px';menu.style.top=e.clientY+'px';menu.innerHTML='<button data-edit>编辑</button><button data-copy>复制</button><button data-delete class="danger">删除</button>';document.body.append(menu);menu.querySelector('[data-edit]').onclick=()=>{menu.remove();openEditor(ev)};menu.querySelector('[data-copy]').onclick=()=>{state.events.push({...ev,id:uid(),title:ev.title+'（副本）'});save();render();menu.remove()};menu.querySelector('[data-delete]').onclick=()=>{menu.remove();deleteEvent(source)};setTimeout(()=>document.addEventListener('click',()=>menu.remove(),{once:true}),0)});$('#calendar').addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();let s=getComputedStyle(document.documentElement).getPropertyValue('--hour'),v=parseInt(s)||56;document.documentElement.style.setProperty('--hour',Math.max(42,Math.min(84,v+(e.deltaY<0?4:-4)))+'px')}},{passive:false});$('#calendar').addEventListener('click',e=>{if(e.target.classList.contains('dayhead')){let ix=[...e.currentTarget.querySelectorAll('.dayhead')].indexOf(e.target);state.cursor=iso(plus(weekStart(parse(state.cursor+'T12:00'),state.weekStartMonday),ix));state.view='day';save();render()}});
/* mini month controls / startup */
render();
})();
