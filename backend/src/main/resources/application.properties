spring.application.name=braincode-api
server.port=8080
spring.datasource.url=jdbc:sqlite:./data/braincode.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jackson.time-zone=Asia/Shanghai
braincode.notes-dir=./data/notes
braincode.lucene-dir=./data/lucene
braincode.ai.provider=${BRAINCODE_AI_PROVIDER:ollama}
braincode.ai.ollama-url=${OLLAMA_BASE_URL:http://localhost:11434}
braincode.ai.ollama-model=${OLLAMA_MODEL:qwen2.5:7b}
braincode.ai.deepseek-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
braincode.ai.deepseek-model=${DEEPSEEK_MODEL:deepseek-flash}
braincode.ai.deepseek-key=${DEEPSEEK_API_KEY:}
